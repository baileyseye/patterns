spring:
  datasource:
    url: jdbc:h2:mem:inbox;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-inbox
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
